
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slam-training"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26" ,
    "scipy>=1.17.1,<1.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
